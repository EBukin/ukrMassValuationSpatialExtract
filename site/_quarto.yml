project:
  type: website
  output-dir: ../docs
  pre-render: _copy-figures.R   # copies the committed figures from output/figures into site/figures
  resources:
    - .nojekyll                 # GitHub Pages serves docs/ as plain static files

website:
  title: "Spatial covariates, Ukraine"
  site-url: https://ebukin.github.io/ukrMassValuationSpatialExtract/
  repo-url: https://github.com/EBukin/ukrMassValuationSpatialExtract
  navbar:
    left:
      - href: en/index.qmd
        text: Home
      - href: en/data.qmd
        text: Data
      - href: en/pipeline.qmd
        text: Pipeline
      - text: Indicators
        menu:
          - href: en/reference.qmd
            text: Reference inputs
          - href: en/distance.qmd
            text: Distance
          - href: en/soil.qmd
            text: Soil
          - href: en/relief.qmd
            text: Relief
          - href: en/crop.qmd
            text: Crop cover
      - href: en/output.qmd
        text: Output
    right:
      - text: Language
        icon: translate
        menu:
          - text: English
            href: en/index.qmd
          - text: Українська
            href: uk/index.qmd
      - icon: github
        href: https://github.com/EBukin/ukrMassValuationSpatialExtract
        aria-label: GitHub repository
  page-footer:
    left: "Simulated reference parcels; real public and user-provided rasters. See the Data page for licences."

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-overflow: wrap
    include-after-body: _language-switch.html

execute:
  echo: false
  warning: false
  message: false

# Two renders, one per language profile, both into ../docs:
#   quarto render site                    # Ukrainian (default profile): root redirect + uk/ pages; new search index
#   quarto render site/en --profile en    # English: en/ pages, added to docs/ and to the search index
# Each profile has its own navbar, title and footer, so links stay in one language without JavaScript.
project:
  type: website
  output-dir: ../docs
  pre-render: _copy-figures.R        # copies the committed figures from output/figures into site/figures
  post-render: _language-switch.R    # points the language link at the same page in the other language
  resources:
    - .nojekyll                      # GitHub Pages serves docs/ as plain static files

profile:
  default: uk

website:
  site-url: https://ebukin.github.io/ukrMassValuationSpatialExtract/
  repo-url: https://github.com/EBukin/ukrMassValuationSpatialExtract

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-overflow: wrap
    tbl-colwidths: true              # keep the column widths set by the dashes under each table header, also in tables with links

execute:
  echo: false
  warning: false
  message: false
